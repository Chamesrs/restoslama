<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>RestosLama ERP</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 95px;
      height: 95px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
      color: #38bdf8;
    }

    p {
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 14px 22px;
      font-size: 16px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(34,197,94,0.4);
    }

    .small {
      margin-top: 15px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- LOGO -->
    <img class="logo"
         src="https://raw.githubusercontent.com/Chamesrs/restoslama/main/logo_slama.png"
         alt="RestosLama Logo">

    <h1>RestosLama ERP</h1>

    <p>
      Solution intelligente de gestion de restauration d’entreprise 🍽️<br><br>
      ✔ Gestion des repas<br>
      ✔ Réservations des employés<br>
      ✔ QR Code de validation<br>
      ✔ Suivi en temps réel
    </p>

    <a class="btn"
       href="https://github.com/Chamesrs/restoslama/releases/latest/download/restoslama.apk">
      📲 Installer l’application
    </a>

    <div class="small">
      Version officielle • RestosLama ERP © 2026
    </div>

  </div>

</body>
</html>
